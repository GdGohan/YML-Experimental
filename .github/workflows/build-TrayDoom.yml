name: Build TrayDoom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar TrayDoom
        uses: actions/checkout@v4
        with:
          repository: Trider12/traydoom
          ref: master
          path: traydoom

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Atualizar Platform Toolset
        shell: pwsh
        working-directory: traydoom
        run: |
          $project = "doomgeneric\doomgeneric.vcxproj"

          Write-Host "Alterando v141 para v143..."

          $content = Get-Content $project -Raw

          if (-not $content.Contains("v141")) {
            Write-Host "v141 não encontrado. Nenhuma alteração necessária."
          }
          else {
            $content = $content -replace 'v141', 'v143'
            Set-Content $project $content -Encoding UTF8
            Write-Host "Platform Toolset atualizado para v143."
          }

      - name: Corrigir ordem dos ícones da bandeja
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host "Aplicando correção em $source"

          $content = Get-Content $source -Raw

          # Código original:
          #
          # for (nid.uID = 0; nid.uID < BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE; nid.uID++)
          # {
          #     Shell_NotifyIcon(NIM_ADD, &nid);
          # }
          #
          # O Windows/Explorer pode apresentar os ícones em ordem
          # inversa à ordem de inserção. Registramos 63 -> 0.
          $old = @'
          for (nid.uID = 0; nid.uID < BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE; nid.uID++)
          {

          //nid.hIcon = CreateIconIndirect(&ii); // this usually reverses the order of icons
          Shell_NotifyIcon(NIM_ADD, &nid);

          //DestroyIcon(nid.hIcon);

          }
          '@

          $new = @'
          // Adiciona os ícones em ordem reversa.
          // O Explorer pode posicionar os ícones em ordem inversa
          // à ordem em que foram registrados.
          for (nid.uID = BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE - 1;
               nid.uID >= 0;
               nid.uID--)
          {
              Shell_NotifyIcon(NIM_ADD, &nid);
          }
          '@

          if (-not $content.Contains($old)) {
            Write-Error "Bloco original de NIM_ADD não encontrado."
            Write-Host "Trecho esperado não encontrado. Abortando para evitar alterar o código errado."
            exit 1
          }

          $content = $content.Replace($old, $new.Trim())

          Set-Content $source $content -Encoding UTF8

          Write-Host "Correção aplicada."
          Write-Host "Ícones serão registrados na ordem: 63 -> 0"
          Write-Host "O DG_DrawFrame continuará atualizando: 0 -> 63"

      - name: Verificar patch
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"
          $content = Get-Content $source -Raw

          Write-Host ""
          Write-Host "=== Verificando ordem de inicialização ==="

          if ($content.Contains("nid.uID = BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE - 1")) {
            Write-Host "OK: loop reverso encontrado."
          }
          else {
            Write-Error "Correção não encontrada no código-fonte."
            exit 1
          }

          Write-Host ""
          Write-Host "=== Trecho relacionado ==="

          Select-String `
            -Path $source `
            -Pattern "BLOCKS_ROW_SIZE \* BLOCKS_ROW_SIZE - 1|Shell_NotifyIcon\(NIM_ADD" `
            -Context 2,2

      - name: Compilar
        shell: pwsh
        working-directory: traydoom
        run: |
          msbuild doomgeneric.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal

      - name: Procurar EXE
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "Executáveis encontrados:"

          Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -ne "vshost.exe" } |
            Select-Object FullName

      - name: Empacotar
        shell: pwsh
        working-directory: traydoom
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe" -and
              $_.FullName -notmatch '\\Debug\\' -and
              $_.FullName -notmatch '\\Release\\.*test'
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nenhum EXE encontrado."
            exit 1
          }

          Write-Host "EXE encontrado:"
          Write-Host $exe.FullName

          New-Item -ItemType Directory -Force -Path output | Out-Null

          Copy-Item `
            $exe.FullName `
            "output\traydoom.exe" `
            -Force

          Write-Host ""
          Write-Host "Pacote criado:"
          Get-Item "output\traydoom.exe" |
            Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TrayDoom-Windows-x64
          path: traydoom/output/traydoom.exe
          if-no-files-found: error
