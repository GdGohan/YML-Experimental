name: Build TrayDoom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar TrayDoom
        uses: actions/checkout@v4
        with:
          repository: Trider12/traydoom
          ref: master
          path: traydoom

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Atualizar Platform Toolset
        shell: pwsh
        working-directory: traydoom
        run: |
          $project = "doomgeneric\doomgeneric.vcxproj"

          Write-Host "Atualizando Platform Toolset para v143..."

          $content = Get-Content $project -Raw
          $content = $content -replace 'v141', 'v143'

          Set-Content $project $content -Encoding UTF8

          Write-Host "Platform Toolset atualizado."

      - name: Corrigir ordem dos ícones
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host "Lendo $source..."

          $content = Get-Content $source -Raw

          # O código original possui:
          #
          # //nid.hIcon = CreateIconIndirect(&ii); // this usually reverses the order of icons
          # Shell_NotifyIcon(NIM_ADD, &nid);
          #
          # Vamos ativar CreateIconIndirect durante a criação dos
          # 64 ícones, pois o próprio autor indica que isso altera
          # a ordem física apresentada pelo Explorer.

          $old = '//nid.hIcon = CreateIconIndirect(&ii); // this usually reverses the order of icons'

          $new = 'nid.hIcon = CreateIconIndirect(&ii);'

          if (-not $content.Contains($old)) {
            Write-Error "Linha esperada não encontrada."
            Write-Host ""
            Write-Host "Procurando referências a CreateIconIndirect:"
            
            $lines = $content -split "`r?`n"

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "CreateIconIndirect") {
                Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
              }
            }

            exit 1
          }

          $content = $content.Replace($old, $new)

          # Também ativa a destruição do HICON criado para evitar
          # vazamento de recursos GDI.
          $oldDestroy = '//DestroyIcon(nid.hIcon);'

          if ($content.Contains($oldDestroy)) {
            $content = $content.Replace(
              $oldDestroy,
              'DestroyIcon(nid.hIcon);'
            )
          }

          Set-Content $source $content -Encoding UTF8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Correção aplicada."
          Write-Host "CreateIconIndirect: ATIVADO"
          Write-Host "DestroyIcon: ATIVADO"
          Write-Host "========================================"

      - name: Mostrar código corrigido
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host ""
          Write-Host "=== Código relacionado aos ícones ==="

          $lines = Get-Content $source

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if (
              $lines[$i] -match "CreateIconIndirect" -or
              $lines[$i] -match "Shell_NotifyIcon" -or
              $lines[$i] -match "DestroyIcon"
            ) {
              Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
            }
          }

      - name: Compilar
        shell: pwsh
        working-directory: traydoom
        run: |
          msbuild doomgeneric.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal

      - name: Procurar EXE
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "Executáveis encontrados:"

          Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe"
            } |
            Select-Object FullName

      - name: Empacotar
        shell: pwsh
        working-directory: traydoom
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe" -and
              $_.FullName -match '\\Release\\'
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nenhum EXE de Release encontrado."
            exit 1
          }

          Write-Host "EXE encontrado:"
          Write-Host $exe.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path output | Out-Null

          Copy-Item `
            $exe.FullName `
            "output\traydoom.exe" `
            -Force

          Write-Host ""
          Write-Host "Arquivo final:"
          Get-Item "output\traydoom.exe" |
            Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TrayDoom-Windows-x64
          path: traydoom/output/traydoom.exe
          if-no-files-found: error
