name: Build TrayDoom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar TrayDoom
        uses: actions/checkout@v4
        with:
          repository: Trider12/traydoom
          ref: master
          path: traydoom

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Atualizar Platform Toolset
        shell: pwsh
        working-directory: traydoom
        run: |
          $project = "doomgeneric\doomgeneric.vcxproj"

          Write-Host "Atualizando Platform Toolset para v143..."

          $content = Get-Content $project -Raw
          $content = $content -replace 'v141', 'v143'

          Set-Content $project $content -Encoding UTF8

          Write-Host "Platform Toolset atualizado."

      - name: Corrigir imagem invertida
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host "Corrigindo orientação horizontal dos blocos..."

          $content = Get-Content $source -Raw

          # Procura o acesso aos pixels dentro do bloco.
          # A alteração espelha horizontalmente cada bloco.
          #
          # IMPORTANTE:
          # Não alteramos nid.uID.
          # Não alteramos a ordem dos 64 ícones.

          $old = 'doomgeneric_getpixel(blockStart + y * DOOMGENERIC_RESX + x)'

          $new = 'doomgeneric_getpixel(blockStart + y * DOOMGENERIC_RESX + (BLOCK_SIZE - 1 - x))'

          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)

            Set-Content $source $content -Encoding UTF8

            Write-Host "Correção aplicada."
          }
          else {
            Write-Host "Padrão exato não encontrado."
            Write-Host ""
            Write-Host "Trechos relevantes do DG_DrawFrame():"

            $lines = Get-Content $source

            $inside = $false

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "DG_DrawFrame") {
                $inside = $true
              }

              if ($inside) {
                Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
              }

              if ($inside -and $lines[$i] -match "^}") {
                break
              }
            }

            Write-Error "Não foi possível aplicar automaticamente."
            exit 1
          }

      - name: Mostrar código corrigido
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host ""
          Write-Host "=== Código relacionado aos ícones ==="

          $lines = Get-Content $source

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if (
              $lines[$i] -match "CreateIconIndirect" -or
              $lines[$i] -match "Shell_NotifyIcon" -or
              $lines[$i] -match "DestroyIcon"
            ) {
              Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
            }
          }

      - name: Compilar
        shell: pwsh
        working-directory: traydoom
        run: |
          msbuild doomgeneric.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal

      - name: Procurar EXE
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "Executáveis encontrados:"

          Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe"
            } |
            Select-Object FullName

      - name: Empacotar
        shell: pwsh
        working-directory: traydoom
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe" -and
              $_.FullName -match '\\Release\\'
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nenhum EXE de Release encontrado."
            exit 1
          }

          Write-Host "EXE encontrado:"
          Write-Host $exe.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path output | Out-Null

          Copy-Item `
            $exe.FullName `
            "output\traydoom.exe" `
            -Force

          Write-Host ""
          Write-Host "Arquivo final:"
          Get-Item "output\traydoom.exe" |
            Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TrayDoom-Windows-x64
          path: traydoom/output/traydoom.exe
          if-no-files-found: error
