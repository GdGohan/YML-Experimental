name: Build TrayDoom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar TrayDoom
        uses: actions/checkout@v4
        with:
          repository: Trider12/traydoom
          ref: master
          path: traydoom

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Atualizar Platform Toolset
        shell: pwsh
        working-directory: traydoom
        run: |
          $project = "doomgeneric\doomgeneric.vcxproj"

          Write-Host "Atualizando Platform Toolset para v143..."

          $content = Get-Content $project -Raw

          if ($content -match 'v141') {
            $content = $content -replace 'v141', 'v143'
            Set-Content $project $content -Encoding UTF8
            Write-Host "v141 -> v143 aplicado."
          }
          else {
            Write-Host "v141 não encontrado. Nada para alterar."
          }

      - name: Corrigir ordem dos blocos
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host "=========================================="
          Write-Host "Corrigindo ordem dos blocos da bandeja"
          Write-Host "Arquivo: $source"
          Write-Host "=========================================="

          $content = Get-Content $source -Raw

          # ---------------------------------------------------------
          # Primeiro garantimos que o código-fonte original não tenha
          # uma alteração anterior de uID.
          #
          # Procuramos:
          #
          # nid.uID = i * BLOCKS_ROW_SIZE + j;
          #
          # e substituímos pelo mapeamento reverso:
          #
          # 0 -> 63
          # 1 -> 62
          # ...
          # 63 -> 0
          # ---------------------------------------------------------

          $old = 'nid.uID = i * BLOCKS_ROW_SIZE + j;'

          $new = @'
          int logicalId = i * BLOCKS_ROW_SIZE + j;
          nid.uID = (BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE - 1) - logicalId;
          '@

          if ($content.Contains($old)) {
            Write-Host "Encontrado mapeamento original."

            $content = $content.Replace(
              $old,
              $new.TrimEnd()
            )

            Write-Host "Mapeamento reverso aplicado."
          }
          elseif (
            $content.Contains(
              'nid.uID = (BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE - 1) - logicalId;'
            )
          ) {
            Write-Host "Mapeamento reverso já está aplicado."
          }
          else {
            Write-Error "Não foi possível encontrar o nid.uID esperado."

            Write-Host ""
            Write-Host "Linhas contendo nid.uID:"

            $lines = $content -split "`r?`n"

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "nid\.uID") {
                Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
              }
            }

            exit 1
          }

          # ---------------------------------------------------------
          # IMPORTANTE:
          #
          # Durante o NIM_ADD inicial, não usamos CreateIconIndirect.
          # O comentário original do TrayDoom informa que isso pode
          # inverter a ordem dos ícones.
          #
          # Portanto, se a linha estiver comentada, deixamos como está.
          # Se alguma execução anterior a ativou, voltamos a comentar.
          # ---------------------------------------------------------

          $content = [regex]::Replace(
            $content,
            '(?m)^(\s*)nid\.hIcon\s*=\s*CreateIconIndirect\(&ii\);\s*$',
            '$1//nid.hIcon = CreateIconIndirect(&ii);',
            1
          )

          # ---------------------------------------------------------
          # Não alterar o CreateIconIndirect usado em DG_DrawFrame().
          #
          # A substituição acima afeta somente a primeira ocorrência,
          # que é a usada durante a inicialização dos ícones.
          # ---------------------------------------------------------

          Set-Content $source $content -Encoding UTF8

          Write-Host ""
          Write-Host "Patch concluído."

      - name: Verificar código corrigido
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"
          $content = Get-Content $source -Raw
          $lines = $content -split "`r?`n"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFICAÇÃO"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Linhas relacionadas aos ícones:"

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if (
              $lines[$i] -match "nid\.uID" -or
              $lines[$i] -match "CreateIconIndirect" -or
              $lines[$i] -match "Shell_NotifyIcon"
            ) {
              Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
            }
          }

          Write-Host ""
          Write-Host "Verificando mapeamento..."

          if (
            $content.Contains(
              'nid.uID = (BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE - 1) - logicalId;'
            )
          ) {
            Write-Host "OK: mapeamento reverso encontrado."
          }
          else {
            Write-Error "ERRO: mapeamento reverso não encontrado."
            exit 1
          }

          Write-Host ""
          Write-Host "Verificação concluída."

      - name: Compilar
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "=========================================="
          Write-Host "COMPILANDO TRAYDOOM"
          Write-Host "=========================================="

          msbuild doomgeneric.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild falhou."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Compilação concluída."

      - name: Procurar EXE
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "=========================================="
          Write-Host "EXECUTÁVEIS ENCONTRADOS"
          Write-Host "=========================================="

          $executables = Get-ChildItem `
            -Recurse `
            -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe"
            }

          if (-not $executables) {
            Write-Error "Nenhum EXE encontrado."
            exit 1
          }

          $executables |
            Select-Object FullName, Length

      - name: Empacotar
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "=========================================="
          Write-Host "EMPACOTANDO"
          Write-Host "=========================================="

          $exe = Get-ChildItem `
            -Recurse `
            -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe" -and
              $_.FullName -match '\\Release\\'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nenhum EXE de Release encontrado."
            exit 1
          }

          Write-Host "EXE selecionado:"
          Write-Host $exe.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path output |
            Out-Null

          Copy-Item `
            -Path $exe.FullName `
            -Destination "output\traydoom.exe" `
            -Force

          Write-Host ""
          Write-Host "Arquivo criado:"

          Get-Item "output\traydoom.exe" |
            Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TrayDoom-Windows-x64
          path: traydoom/output/traydoom.exe
          if-no-files-found: error
