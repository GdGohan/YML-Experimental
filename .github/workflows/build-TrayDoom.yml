name: Build TrayDoom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar TrayDoom
        uses: actions/checkout@v4
        with:
          repository: Trider12/traydoom
          ref: master
          path: traydoom

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Atualizar Platform Toolset
        shell: pwsh
        working-directory: traydoom
        run: |
          $project = "doomgeneric\doomgeneric.vcxproj"

          Write-Host "Atualizando Platform Toolset para v143..."

          $content = Get-Content $project -Raw
          $content = $content -replace 'v141', 'v143'

          Set-Content $project $content -Encoding UTF8

          Write-Host "Platform Toolset atualizado."

      - name: Corrigir ordem dos ícones
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"

          Write-Host "Lendo $source..."

          $content = Get-Content $source -Raw

          # Mostra onde estão os NIM_ADD antes da alteração.
          Write-Host ""
          Write-Host "=== NIM_ADD encontrados ==="

          $matches = [regex]::Matches(
            $content,
            'Shell_NotifyIcon\s*\(\s*NIM_ADD\s*,\s*&nid\s*\)'
          )

          Write-Host "Quantidade encontrada: $($matches.Count)"

          if ($matches.Count -eq 0) {
            Write-Error "Nenhum Shell_NotifyIcon(NIM_ADD, &nid) encontrado."
            exit 1
          }

          # Procura especificamente o loop que inicializa os 64 ícones.
          #
          # Original esperado:
          #
          # for (nid.uID = 0; nid.uID < BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE; nid.uID++)
          #
          # O regex aceita espaços e quebras de linha diferentes.
          $pattern = '(?s)for\s*\(\s*nid\.uID\s*=\s*0\s*;\s*nid\.uID\s*<\s*BLOCKS_ROW_SIZE\s*\*\s*BLOCKS_ROW_SIZE\s*;\s*nid\.uID\s*\+\+\s*\)\s*\{.*?Shell_NotifyIcon\s*\(\s*NIM_ADD\s*,\s*&nid\s*\)\s*;\s*\}'

          $match = [regex]::Match($content, $pattern)

          if (-not $match.Success) {
            Write-Error "Loop original de inicialização dos ícones não foi encontrado."

            Write-Host ""
            Write-Host "Trechos contendo 'nid.uID':"

            $lines = $content -split "`r?`n"

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "nid\.uID") {
                Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
              }
            }

            exit 1
          }

          Write-Host ""
          Write-Host "Loop encontrado na posição $($match.Index)."

          $replacement = @'
          // Adiciona os ícones em ordem reversa.
          //
          // O Explorer pode posicionar os ícones da bandeja
          // em ordem diferente da ordem de atualização.
          for (nid.uID = BLOCKS_ROW_SIZE * BLOCKS_ROW_SIZE - 1;
               nid.uID >= 0;
               nid.uID--)
          {
              Shell_NotifyIcon(NIM_ADD, &nid);
          }
          '@

          $content = $content.Remove(
            $match.Index,
            $match.Length
          ).Insert(
            $match.Index,
            $replacement.Trim()
          )

          Set-Content $source $content -Encoding UTF8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Correção aplicada com sucesso."
          Write-Host "Ícones registrados na ordem: 63 -> 0"
          Write-Host "========================================"

      - name: Verificar código corrigido
        shell: pwsh
        working-directory: traydoom
        run: |
          $source = "doomgeneric\doomgeneric_win.c"
          $content = Get-Content $source -Raw

          Write-Host "Verificando código-fonte..."

          if ($content -match 'nid\.uID\s*=\s*BLOCKS_ROW_SIZE\s*\*\s*BLOCKS_ROW_SIZE\s*-\s*1') {
            Write-Host "OK: loop reverso encontrado."
          }
          else {
            Write-Error "Loop reverso não encontrado."
            exit 1
          }

          Write-Host ""
          Write-Host "Linhas com nid.uID:"

          $lines = $content -split "`r?`n"

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "nid\.uID") {
              Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
            }
          }

      - name: Compilar
        shell: pwsh
        working-directory: traydoom
        run: |
          msbuild doomgeneric.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /v:minimal

      - name: Procurar EXE
        shell: pwsh
        working-directory: traydoom
        run: |
          Write-Host "Executáveis encontrados:"

          Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe"
            } |
            Select-Object FullName

      - name: Empacotar
        shell: pwsh
        working-directory: traydoom
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -ne "vshost.exe" -and
              $_.FullName -match '\\Release\\'
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nenhum EXE de Release encontrado."
            exit 1
          }

          Write-Host "EXE encontrado:"
          Write-Host $exe.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path output | Out-Null

          Copy-Item `
            $exe.FullName `
            "output\traydoom.exe" `
            -Force

          Write-Host ""
          Write-Host "Arquivo final:"
          Get-Item "output\traydoom.exe" |
            Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TrayDoom-Windows-x64
          path: traydoom/output/traydoom.exe
          if-no-files-found: error
