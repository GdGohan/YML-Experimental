name: Build cydoomgeneric Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check compiler
        shell: cmd
        run: |
          python --version
          python -c "import platform; print(platform.architecture()); print(platform.machine())"
          where cl
          cl

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build cydoomgeneric wheel
        run: |
          python -m pip wheel cydoomgeneric --no-deps --wheel-dir dist

      - name: List generated files
        shell: cmd
        run: |
          dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: cydoomgeneric-windows-x64-python312
          path: dist/*.whl
          if-no-files-found: error
